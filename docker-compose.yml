services:
  linkpool:
    restart: unless-stopped

    ports:
      - "${URL_PORT}:3000"

    volumes:
      - ./data:/data/data

    depends_on:
      - meilisearch
      - redis

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes

    volumes:
      - ./redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped

    volumes:
      - ./meili_data:/meili_data
