services:
  postgres:
    image: postgres:16-alpine

    env_file:
      - .env

    restart: unless-stopped

    volumes:
      - ./pgdata:/var/lib/postgresql/data

  linkpool:
    build:
      context: .
      dockerfile: Dockerfile

    image: linkpool:dev

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres

    depends_on:
      - postgres
      # - meilisearch
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    image: linkpool:dev

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres

    command: sh -c "export PATH=/data/node_modules/.bin:$PATH && prisma migrate deploy --schema=/data/packages/prisma/schema.prisma && cd /data/apps/worker && exec tsx worker.ts"

    depends_on:
      - postgres
      # - meilisearch
      - redis

  # meilisearch:
  #   env_file:
  #     - .env
